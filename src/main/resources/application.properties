spring.application.name=korjaamosovellus
server.port=${PORT:8080}

# Ilman erillistä profiilia sovellus käynnistyy dev-tilassa H2-tiedostokannalla.
# docker-compose asettaa profiiliksi "docker" (PostgreSQL).
spring.profiles.default=dev

# Skeema päivitetään entiteeteistä. Harjoitustyöhön riittävä ratkaisu; tuotannossa
# käytettäisiin Flyway-migraatioita, koska update ei koskaan poista tai nimeä sarakkeita.
spring.jpa.hibernate.ddl-auto=update
# Open-in-view pois päältä: lazy-relaatioiden haku on pakko tehdä tietoisesti palvelukerroksessa
# (fetch join / EntityGraph), joten N+1-kyselyt eivät pääse piiloutumaan näkymäkoodiin.
spring.jpa.open-in-view=false

vaadin.allowed-packages=com.vaadin,org.vaadin,fi.kurvinen.korjaamo
vaadin.launch-browser=false

app.upload-dir=${APP_UPLOAD_DIR:./data/uploads}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail.from=${APP_MAIL_FROM:noreply@korjaamo.local}

# Mailpit (kehitys-SMTP) kuuntelee porttia 1025 ilman autentikointia.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# Envers: modified-flag kertoo suoraan, mitkä kentät revisiossa muuttuivat, ja
# store_data_at_delete säilyttää poistetun rivin arvot historiaa varten.
spring.jpa.properties.org.hibernate.envers.global_with_modified_flag=true
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
